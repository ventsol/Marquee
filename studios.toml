# ─────────────────────────────────────────────────────────────────────────────
# studios.toml — curated registry of official studio YouTube channels.
#
# Adding a studio = add one [[studio]] block. No code changes required.
#
#   name       = studio label shown in the embed footer
#   channel_id = YouTube channel ID (starts with "UC", 24 chars)
#   genres     = genre tags used for genre-role routing
#   region     = optional; "en" (default), "in", "jp", ...
#
# Every channel_id below was verified against its live RSS feed.
# Re-verify any time with:  python -m tools.validate_studios
#
# To find a channel id: open the channel page -> View Source -> search "externalId"
# ─────────────────────────────────────────────────────────────────────────────

